# --- Font Configuration ---
font_family      JetBrainsMono Nerd Font
font_size        13.0

# --- Cursor Behavior ---
# 'none' enables reverse video/inversion, ensuring the cursor 
# is always visible regardless of the selection or background color.
cursor           none

# --- Lackluster/Afterglow Theme Colors ---
background            #202020
foreground            #d0d0d0

selection_background  #303030
selection_foreground  #202020

# Standard Terminal Colors
color0                #151515
color8                #505050

# Red
color1                #ac4142
color9                #ac4142

# Green
color2                #7e8d50
color10               #7e8d50

# Yellow
color3                #e5b566
color11               #e5b566

# Blue
color4                #6c99ba
color12               #6c99ba

# Magenta
color5                #9e4e85
color13               #9e4e85

# Cyan
color6                #7dd5cf
color14               #7dd5cf

# White
color7                #d0d0d0
color15               #f5f5f5

# --- Performance & Settings ---
# Ensures the cursor doesn't blink too aggressively (optional)
cursor_blink_interval 0
