icons_format = "{icon}"

[theme]
theme = "plain"
[theme.overrides]
separator = "  "
idle_bg = "#262626"
idle_fg = "#e0e0e0"
separator_bg = "#262626"
separator_fg = "#262626"
info_bg = "#262626"
info_fg = "#ffffff"
warning_bg = "#262626"
warning_fg = "#808080"
critical_bg = "#262626"
critical_fg = "#ffffff"
good_bg = "#262626"
good_fg = "#e0e0e0"

[icons]
icons = "awesome5"
[icons.overrides]
bat = ["", "", "", "", ""]
bat_charging = ""

[[block]]
block = "cpu"
interval = 2
format = "  $utilization% "

[[block]]
block = "memory"
format = "  $mem_used_percents% "
format_alt = "  $mem_used.eng(w:3, u:B, p:G) / $mem_total.eng(w:3, u:B, p:G) "

[[block]]
block = "disk_space"
path = "/"
info_type = "available"
format = "  $available "

[[block]]
block = "net"
device = "enp42s0"
format = "  $speed_down / $speed_up "
interval = 5

[[block]]
block = "custom"
command = "echo "
interval = "once"
[[block.click]]
button = "left"
cmd = "autodnd"

[[block]]
block = "sound"
format = " $icon $volume "
[[block.click]]
button = "left"
cmd = "pavucontrol"

[[block]]
block = "time"
interval = 1
format = "  $timestamp.datetime(f:'%a %d %b %H:%M:%S') "
