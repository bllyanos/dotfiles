icons_format = "{icon}"

[theme]
theme = "plain"
[theme.overrides]
separator = "  "
idle_bg = "#1a1a1a"
idle_fg = "#e0e0e0"
info_bg = "#333333"
info_fg = "#ffffff"
warning_bg = "#666666"
warning_fg = "#ffffff"
critical_bg = "#999999"
critical_fg = "#ffffff"

[icons]
icons = "awesome5"
[icons.overrides]
bat = ["", "", "", "", ""]
bat_charging = ""

[[block]]
block = "cpu"
interval = 2
format = "  $utilization "

[[block]]
block = "memory"
format = "  $mem_total_used_percents.eng(w:2) "
format_alt = "  $mem_used.eng(w:3, u:B, p:G) / $mem_total.eng(w:3, u:B, p:G) "

[[block]]
block = "disk_space"
path = "/"
info_type = "available"
format = "  $available "

[[block]]
block = "net"
device = "enp42s0"
format = "  $speed_down.eng(w:3)  $speed_up.eng(w:3)  "
interval = 5

[[block]]
block = "custom"
command = "echo dnd"
[[block.click]]
button = "left"
cmd = "autodnd"

[[block]]
block = "sound"
format = " $icon $volume "
[[block.click]]
button = "left"
cmd = "pavucontrol"

[[block]]
block = "custom"
command = "echo dnd"
[[block.click]]
button = "left"
cmd = "autodnd"

[[block]]
block = "time"
interval = 1
format = "  $timestamp.datetime(f:'%a %d %b %R:%S') "
